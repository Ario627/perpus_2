<!DOCTYPE html>
<html lang="id" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="description"
        content="Pustaka — cek ketersediaan buku, ajukan peminjaman, dan verifikasi sirkulasi perpustakaan sekolah lewat QR Code." />
    <title>Pustaka · Perpustakaan Digital</title>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f5a4b'/%3E%3Crect x='9' y='8' width='3' height='16' rx='1.5' fill='%23f7f6f2'/%3E%3Crect x='14.5' y='11' width='3' height='13' rx='1.5' fill='%23f7f6f2' opacity='.72'/%3E%3Crect x='20' y='14' width='3' height='10' rx='1.5' fill='%23f7f6f2' opacity='.46'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#f7f6f2',
                        surface: '#ffffff',
                        ink: { DEFAULT: '#191813', soft: '#57554d', mute: '#8f8d84' },
                        line: { DEFAULT: '#e6e4dc', strong: '#d5d2c8' },
                        accent: { DEFAULT: '#2f5a4b', deep: '#234438', soft: '#e9efec' },
                        'tunggu-bg': '#fbf1da',
                        'tunggu-fg': '#7a5514',
                        'tunggu-dot': '#cf9a20',
                        'tunggu-line': '#f0dcb4',
                        'jalan-bg': '#e7eff9',
                        'jalan-fg': '#1f4d84',
                        'jalan-dot': '#3d7ac9',
                        'jalan-line': '#cddff0',
                        'tuntas-bg': '#e6f2ea',
                        'tuntas-fg': '#1f5539',
                        'tuntas-dot': '#35935f',
                        'tuntas-line': '#c8e2d2',
                        'lewat-bg': '#eeece6',
                        'lewat-fg': '#5f5d56',
                        'lewat-dot': '#a3a199',
                        'lewat-line': '#dcd8ce',
                    },
                    fontFamily: {
                        sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['"Instrument Serif"', 'ui-serif', 'Georgia', 'serif'],
                    },
                    boxShadow: {
                        card: '0 1px 2px rgba(25, 24, 19, .05)',
                        pop: '0 32px 70px -32px rgba(25, 24, 19, .5)',
                        bar: '0 1px 0 rgba(25, 24, 19, .06)',
                    },
                    maxWidth: { shell: '70rem' },
                    keyframes: {
                        rise: {
                            from: { opacity: '0', transform: 'translateY(8px)' },
                            to: { opacity: '1', transform: 'none' },
                        },
                        pop: {
                            from: { opacity: '0', transform: 'translateY(12px) scale(.985)' },
                            to: { opacity: '1', transform: 'none' },
                        },
                    },
                    animation: {
                        rise: 'rise .34s cubic-bezier(.2, .7, .2, 1) both',
                        pop: 'pop .26s cubic-bezier(.2, .7, .2, 1) both',
                    },
                },
            },
        };
    </script>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] {
            display: none !important;
        }

        body {
            text-rendering: optimizeLegibility;
        }

        ::selection {
            background: #2f5a4b;
            color: #f7f6f2;
        }

        :focus-visible {
            outline: 2px solid #2f5a4b;
            outline-offset: 2px;
            border-radius: 8px;
        }

        #view:focus {
            outline: none;
        }

        .tnum {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
        }

        [data-until] {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
        }

        [data-until][data-urgency='segera'] {
            color: #8f3323;
        }

        .drain {
            transform-origin: left center;
            animation: drain linear forwards;
        }

        @keyframes drain {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        #reader {
            border: 0 !important;
            background: rgba(25, 24, 19, 0.05);
        }

        #reader>div {
            border: 0 !important;
        }

        #reader video {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #reader canvas {
            display: none;
        }

        .skip-link {
            position: fixed;
            top: -4rem;
            left: 1rem;
            z-index: 100;
            padding: 0.625rem 1rem;
            border-radius: 999px;
            background: #191813;
            color: #f7f6f2;
            font-size: 0.875rem;
            transition: top 0.18s ease;
        }

        .skip-link:focus {
            top: 1rem;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .has-shadow-scroll {
            scrollbar-width: thin;
            scrollbar-color: #d5d2c8 transparent;
        }

        #print-root {
            display: none;
        }

        .qr-sheet {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10mm;
        }

        .qr-cell {
            break-inside: avoid;
            padding: 4mm;
            border: 1px dashed #b9b6ac;
            border-radius: 3mm;
            text-align: center;
        }

        .qr-cell canvas,
        .qr-cell img {
            display: block;
            margin: 0 auto;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media print {
            @page {
                margin: 12mm;
            }

            body>*:not(#print-root) {
                display: none !important;
            }

            body {
                background: #ffffff;
            }

            #print-root {
                display: block;
            }
        }
    </style>
</head>

<body class="min-h-dvh bg-paper font-sans text-ink antialiased">
    <a class="skip-link" href="#view">Lewati ke konten</a>

    <div id="app" class="flex min-h-dvh flex-col">
        <header id="appbar" class="sticky top-0 z-40"></header>

        <main id="view" class="flex-1" tabindex="-1">
            <div class="mx-auto w-full max-w-shell px-5 py-10 sm:px-8 sm:py-14">
                <div class="h-3 w-20 animate-pulse rounded-full bg-line"></div>
                <div class="mt-5 h-9 w-64 max-w-full animate-pulse rounded-lg bg-line"></div>
                <div class="mt-3 h-4 w-80 max-w-full animate-pulse rounded-full bg-line/70"></div>
                <div class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                    <div class="h-44 rounded-2xl border border-line bg-surface/70"></div>
                    <div class="h-44 rounded-2xl border border-line bg-surface/70"></div>
                    <div class="h-44 rounded-2xl border border-line bg-surface/70"></div>
                </div>
            </div>
        </main>

        <div id="appfoot" class="mt-auto"></div>
    </div>

    <div id="toast"
        class="pointer-events-none fixed inset-x-4 bottom-[4.75rem] z-[60] flex flex-col items-stretch gap-2 sm:inset-x-auto sm:bottom-auto sm:right-8 sm:top-[5.25rem] sm:w-[22rem] sm:items-end"
        role="status" aria-live="polite"></div>

    <div id="modal" class="fixed inset-0 z-50 hidden"></div>
    <div id="print-root"></div>

    <noscript>
        <div class="mx-auto max-w-shell px-5 py-16 sm:px-8">
            <p class="font-display text-3xl">JavaScript dimatikan</p>
            <p class="mt-2 text-sm text-ink-soft">
                Pustaka berjalan sepenuhnya di browser. Aktifkan JavaScript untuk melanjutkan.
            </p>
        </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
</body>

</html>
